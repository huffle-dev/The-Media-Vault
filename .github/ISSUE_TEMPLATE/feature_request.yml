name: Feature request
description: Something you'd like it to do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that is hard today?
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options: [Windows app, Android app, Both / not sure]
