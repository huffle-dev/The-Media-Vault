name: Release

# Push a tag like v1.0.1 (after bumping "version" in package.json to match) and this builds the
# Windows installer and attaches it to a release for that tag. The Android APK is built separately
# with EAS and added to the release by hand (see docs/release-checklist.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"; exit 1; fi
      - run: npm run dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/TheMediaVault-Setup-*.exe \
            --title "The Media Vault ${GITHUB_REF_NAME}" --generate-notes --verify-tag
