<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Media Vault — online demo</title>
    <meta name="description" content="Try The Media Vault in your browser with a made-up library. Nothing is saved." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      background: #09090e;
      color: #ddddf0;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
    /* Remove default input/select/textarea appearance */
    input, select, textarea, button {
      font-family: inherit;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
    }
    /* Skeleton placeholder pulse — used by the Item Profile "Similar To" and
       "More from ..." rows while their external lookups are in flight. Only
       the animation lives here; the fill colour is set inline from the theme
       token (T.surface2) so this works in both light and dark themes. */
    @keyframes skel-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    .skel-pulse { animation: skel-pulse 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .skel-pulse { animation: none; opacity: 0.6; }
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="demo-banner"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
